name: Build and Push Docker Image

on:
  push:
    branches:
      - main
    paths:
      - 'Splitty-API/**'
      - '.github/workflows/docker-publish.yml'
      - '!Splitty-API/Splitty.API.Tests/**'
      - '!**/*.md'
  workflow_dispatch:

# Never run two deploys at once; a newer push waits for the current one.
concurrency:
  group: docker-publish
  cancel-in-progress: false

jobs:
  build-and-push:
    # The image targets linux/arm64, so build natively instead of under QEMU.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Lowercase repository name
        id: repo
        run: echo "name=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      # The Dockerfile's COPY paths are relative to the solution directory, so the
      # build context is Splitty-API rather than the repository root.
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ./Splitty-API
          file: Splitty-API/Splitty.API/Dockerfile
          push: true
          platforms: linux/arm64
          tags: |
            ghcr.io/${{ steps.repo.outputs.name }}:latest
            ghcr.io/${{ steps.repo.outputs.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to Coolify
        env:
          COOLIFY_WEBHOOK: ${{ secrets.COOLIFY_WEBHOOK }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          curl --fail-with-body --request POST "$COOLIFY_WEBHOOK" \
            --header "Authorization: Bearer $COOLIFY_TOKEN"
