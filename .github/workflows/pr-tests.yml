name: PR tests

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: pr-tests-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      pull-requests: read
    outputs:
      api: ${{ steps.filter.outputs.api }}
      ios: ${{ steps.filter.outputs.ios }}
    steps:
      # PR files come from the API, so this job needs no checkout.
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          predicate-quantifier: some-with-excludes
          filters: |
            api:
              - 'Splitty-API/**'
              - '.github/workflows/pr-tests.yml'
              - 'global.json'
              - 'NuGet.Config'
              - 'nuget.config'
              - 'Directory.Build.*'
              - 'Directory.Packages.props'
              - '!**/*.md'
            ios:
              - 'Splitty/**'
              - '.xcode-version'
              - '.github/workflows/pr-tests.yml'
              - '!Splitty/SplittyUITests/**'
              - '!**/*.md'

  api:
    name: API tests
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '9.0.x'

      # There are no NuGet lockfiles yet. Cache packages, then always restore
      # project assets instead of caching bin/obj or skipping restore on a hit.
      - uses: actions/cache@v6
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: nuget-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Splitty-API/**/*.csproj', '**/Directory.Build.*', '**/Directory.Packages.props', '**/[Nn]u[Gg]et.[Cc]onfig', '**/global.json') }}
          restore-keys: |
            nuget-${{ runner.os }}-${{ runner.arch }}-

      - name: Restore test project
        run: dotnet restore Splitty-API/Splitty.API.Tests/Splitty.API.Tests.csproj

      - name: Run API tests
        run: >-
          dotnet test Splitty-API/Splitty.API.Tests/Splitty.API.Tests.csproj
          --configuration Release
          --no-restore
          --logger "trx;LogFileName=api.trx"
          --results-directory "${RUNNER_TEMP}/api-results"

      - name: Upload API results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: api-test-results
          path: ${{ runner.temp }}/api-results
          if-no-files-found: ignore
          retention-days: 7

  ios:
    name: iOS unit tests
    needs: changes
    if: needs.changes.outputs.ios == 'true'
    # Matches .xcode-version; this image currently has preview status.
    runs-on: xcode-27
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Select pinned Xcode
        id: xcode
        shell: bash
        run: |
          xcode_version=$(tr -d '[:space:]' < .xcode-version)
          developer_dir="/Applications/Xcode_${xcode_version}.app/Contents/Developer"
          if [[ ! -d "$developer_dir" ]]; then
            echo "::error::Pinned Xcode ${xcode_version} is not installed on this runner."
            exit 1
          fi
          export DEVELOPER_DIR="$developer_dir"
          echo "DEVELOPER_DIR=$developer_dir" >> "$GITHUB_ENV"
          xcodebuild -version
          echo "build=$(xcodebuild -version | awk '/Build version/ { print $3 }')" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/SourcePackages
          key: swiftpm-${{ runner.os }}-${{ runner.arch }}-${{ steps.xcode.outputs.build }}-${{ hashFiles('Splitty/Splitty.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: |
            swiftpm-${{ runner.os }}-${{ runner.arch }}-${{ steps.xcode.outputs.build }}-

      - name: Select one installed iPhone simulator
        shell: bash
        run: |
          xcrun simctl list devices available --json > "$RUNNER_TEMP/simulators.json"
          python3 - <<'PY'
          import json
          import os
          import re

          with open(os.path.join(os.environ["RUNNER_TEMP"], "simulators.json")) as file:
              devices = json.load(file)["devices"]
          candidates = []
          for runtime, runtime_devices in devices.items():
              match = re.search(r"\.iOS-(\d+)-(\d+)(?:-(\d+))?$", runtime)
              if not match:
                  continue
              version = tuple(int(part or 0) for part in match.groups())
              if version < (18, 2, 0):
                  continue
              for device in runtime_devices:
                  if device["isAvailable"] and device["name"].startswith("iPhone"):
                      candidates.append((version, device["name"], device["udid"]))
          if not candidates:
              raise SystemExit("No available iPhone simulator with iOS >= 18.2.")
          version, name, udid = max(candidates)
          print(f"Using {name}, iOS {'.'.join(map(str, version))}")
          with open(os.environ["GITHUB_ENV"], "a") as file:
              file.write(f"IOS_SIMULATOR_ID={udid}\n")
          PY

      - name: Build and run iOS unit tests
        shell: bash
        run: |
          set -o pipefail
          xcodebuild test \
            -project Splitty/Splitty.xcodeproj \
            -scheme SplittyUnitTests \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$IOS_SIMULATOR_ID" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/SourcePackages" \
            -onlyUsePackageVersionsFromResolvedFile \
            -only-testing:SplittyTests \
            -parallel-testing-enabled NO \
            -enableCodeCoverage NO \
            -resultBundlePath "$RUNNER_TEMP/ios-results.xcresult" \
            CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            2>&1 | tee "$RUNNER_TEMP/ios-tests.log"

      # Successful runs retain their log in Actions. Only failures upload the
      # larger result bundle, keeping storage and the successful path small.
      - name: Upload iOS failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ios-test-failure
          path: |
            ${{ runner.temp }}/ios-results.xcresult
            ${{ runner.temp }}/ios-tests.log
          if-no-files-found: ignore
          retention-days: 7

  required:
    name: PR tests
    needs: [changes, api, ios]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Check required results
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          API_CHANGED: ${{ needs.changes.outputs.api }}
          API_RESULT: ${{ needs.api.result }}
          IOS_CHANGED: ${{ needs.changes.outputs.ios }}
          IOS_RESULT: ${{ needs.ios.result }}
        shell: bash
        run: |
          [[ "$CHANGES_RESULT" == success ]] || exit 1
          for component in API IOS; do
            changed_var="${component}_CHANGED"
            result_var="${component}_RESULT"
            changed="${!changed_var}"
            result="${!result_var}"
            echo "$component: changed=$changed, result=$result"
            case "$changed:$result" in
              true:success|false:skipped) ;;
              *) exit 1 ;;
            esac
          done
